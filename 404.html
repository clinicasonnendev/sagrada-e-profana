<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sagrada e Profana</title>
<script>
  // ============================================================
  // Truque padrão para URLs limpas no GitHub Pages (spa-github-pages).
  //
  // AJUSTE ESTA LINHA conforme o tipo de site no GitHub:
  //   - Site de USUÁRIO/ORGANIZAÇÃO (repositório chamado
  //     "seu-usuario.github.io", endereço final tipo
  //     https://seu-usuario.github.io/)                -> deixe em 0
  //   - Site de PROJETO (qualquer outro nome de repositório,
  //     endereço final tipo
  //     https://seu-usuario.github.io/nome-do-repo/)    -> deixe em 1
  // ============================================================
  var pathSegmentsToKeep = 0;

  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body>
  Redirecionando…
</body>
</html>
