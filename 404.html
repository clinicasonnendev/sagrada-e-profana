<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sagrada e Profana</title>
<script>
  // ============================================================
  // Truque padrão para URLs limpas no GitHub Pages (spa-github-pages).
  //
  // Este repositório é publicado como Project Page em:
  //   https://clinicasonnendev.github.io/sagrada-e-profana/
  // por isso pathSegmentsToKeep fica em 1 (mantém o "/sagrada-e-profana"
  // do início da URL). Só mude se o endereço do site mudar de formato.
  // ============================================================
  var pathSegmentsToKeep = 1;

  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body>

</body>
</html>
